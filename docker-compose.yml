services:
  mysql:
    image: mysql:8.4
    container_name: hathanh-mysql
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ha_thanh_home}
      MYSQL_USER: ${MYSQL_USER:-hathanh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hathanh_secure_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hathanh_root_password}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-31906}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hathanh-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${API_PORT:-31875}:4000"
    volumes:
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hathanh-web
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:31875/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000/api}
    ports:
      - "${WEB_PORT:-31873}:3000"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:31873}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:31875/api}
        ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-}
        NEXT_PUBLIC_ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-}
    container_name: hathanh-admin
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PORT: 3001
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:31873}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:31875/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000/api}
    ports:
      - "${ADMIN_PORT:-31874}:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
