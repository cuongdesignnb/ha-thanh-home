# Nginx config cho aaPanel — 1 domain reverse proxy cả web/admin/api/uploads.
#
# CÁCH DÙNG:
#   1. aaPanel → Website → Add site domain: hathanh.cuongdesign.net (không cần PHP).
#   2. Vào Site → Config → URL Rewrite (hoặc edit /www/server/panel/vhost/nginx/<domain>.conf).
#   3. DÁN nội dung của các block `location` bên dưới vào trong `server { ... }` của domain.
#   4. Reload Nginx (aaPanel → Nginx → Reload).
#   5. SSL: aaPanel → Site → SSL → Let's Encrypt → bật Force HTTPS.
#
# Lưu ý: thay /www/wwwroot/ha-thanh-home bằng đường dẫn thực tế repo trên VPS.

# Upload size (ảnh thiết kế có thể lớn)
client_max_body_size 50M;

# 1) Static uploads — Nginx serve trực tiếp, không qua Node
location /uploads/ {
    alias /www/wwwroot/ha-thanh-home/storage/uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}

# 2) Admin (Next.js, basePath=/admin) → container 127.0.0.1:31874
location /admin {
    proxy_pass http://127.0.0.1:31874;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
}

# 3) API (NestJS) → container 127.0.0.1:31875
#    Container expose /api ở root, nên giữ nguyên path.
location /api/ {
    proxy_pass http://127.0.0.1:31875/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# 4) Web (Next.js public site) → container 127.0.0.1:31873
location / {
    proxy_pass http://127.0.0.1:31873;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
}
